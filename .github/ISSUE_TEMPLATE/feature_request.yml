name: Feature Request
description: Suggest a scoped addition for the public preview.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        GoodQ4All is currently an Epistemic Memory Preview. Please keep requests scoped to local-first memory, observability, and first-run usability.
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What user problem would this solve?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - API
        - CLI
        - Watchdog
        - Persisted artifacts
        - Documentation
        - Packaging / installer
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful behavior or documentation change.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Preview boundaries
      options:
        - label: This request does not assume a production UI, healthcare/regulatory readiness, or autonomous mutation/control behavior.
          required: true
        - label: This request does not require bundling private media, witness outputs, or optional corpus data in the base installer.
          required: true
