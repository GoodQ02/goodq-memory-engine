name: First-Run Problem
description: Report trouble cloning, bootstrapping, validating, or processing one file.
title: "[First Run]: "
labels:
  - bug
  - first-run
body:
  - type: markdown
    attributes:
      value: |
        Please redact secrets, tokens, private paths, and media names before submitting. GoodQ4All should fail visibly; a focused report helps us distinguish local setup issues from repo issues.
  - type: input
    id: commit
    attributes:
      label: Commit or release
      placeholder: v0.1.1 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: host_profile
    attributes:
      label: Host profile
      options:
        - BASELINE
        - GPU_ENHANCED
        - Unsure
    validations:
      required: true
  - type: checkboxes
    id: setup_area
    attributes:
      label: Setup area
      options:
        - label: Bootstrap command failed
        - label: Bootstrap validation failed
        - label: Qdrant was not reachable
        - label: FFmpeg was not reachable
        - label: Watchdog did not process a file
        - label: API did not start or report health
        - label: Optional audio or WSL enrichment failed
  - type: textarea
    id: command
    attributes:
      label: Command or action that failed
      description: Paste the exact command or UI action. Replace private path segments with placeholders.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Redacted output
      description: Include the smallest useful console or log excerpt. Do not include secrets or local config values.
      render: text
    validations:
      required: true
  - type: textarea
    id: hygiene
    attributes:
      label: Bootstrap hygiene snapshot summary
      description: If available, summarize the non-destructive hygiene snapshot result. Do not attach private config files.
  - type: textarea
    id: success_boundary
    attributes:
      label: What worked before the failure?
      description: For example, clone succeeded, core environment created, Qdrant service installed, or one file moved out of the import inbox.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, tokens, private paths, local config values, and private media details from this report.
          required: true
