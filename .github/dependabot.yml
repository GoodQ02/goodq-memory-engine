version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 2
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 2
    groups:
      api-python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/wsl2_audio"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 2
    groups:
      wsl2-audio-python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
