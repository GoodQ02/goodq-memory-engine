name: ci

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-baseline:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GOODQ_DATA_ROOT: ${{ github.workspace }}\_ci\GoodQ_Data
      GOODQ_HOST_PROFILE: BASELINE
      GOODQ_REQUIRE_GPU: "0"
      GOODQ_REQUIRE_WSL_AUDIO: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare CI data root
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:GOODQ_DATA_ROOT" | Out-Null

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: goodq_core
          auto-activate: false
          environment-file: environment-baseline-lock.yml

      - name: Runtime version receipt
        shell: pwsh
        run: |
          Write-Output "PowerShell $($PSVersionTable.PSVersion); runner $env:ImageOS $env:ImageVersion"
          conda run -n goodq_core python -c "import importlib.metadata as metadata, json, sys; names = ('fastapi', 'starlette', 'httpx', 'pydantic', 'pytest', 'goodq-mini-agent'); print(json.dumps({'python': sys.version.split()[0], **{name: metadata.version(name) for name in names}}, sort_keys=True))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          conda run -n goodq_core python -m pip check

      - name: Documentation drift lint
        shell: pwsh
        run: conda run -n goodq_core python scripts/docs/doc_drift_lint.py

      - name: Documentation authority lint
        shell: pwsh
        run: conda run -n goodq_core python scripts/docs/doc_authority_lint.py verify

      - name: Dependency drift lint
        shell: pwsh
        run: conda run -n goodq_core python scripts/docs/dependency_drift_lint.py

      - name: Banned token lint
        shell: pwsh
        run: conda run -n goodq_core python scripts/docs/banned_token_lint.py

      - name: Bootstrap verification
        shell: pwsh
        run: conda run -n goodq_core python scripts/bootstrap_verify.py --json --profile ci

      - name: Installer semantic compatibility
        shell: pwsh
        run: conda run -n goodq_core python scripts/install/verify_installer_semantic_contract.py --check --repo-root .

      - name: Unit test suite
        shell: pwsh
        run: conda run -n goodq_core python -m pytest -q -ra --durations=15
