name: ci

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    paths:
      - ".github/workflows/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "configs/**"
      - "envs/**"
      - "scripts/**"
      - "steps/**"
      - "tests/**"
      - "environment.yml"
      - "environment.gpu.yml"
      - "environment-baseline-lock.yml"
      - "requirements-baseline-lock.txt"
      - "wsl2_audio/**"
      - "setup.py"
      - "pytest.ini"
      - "LAUNCH_GOODQ.bat"
      - "LAUNCH_GOODQ.ps1"
      - "dev_on.bat"
      - "dev_on.sh"
      - "dev_off.bat"
      - "dev_off.sh"
      - "start_goodq_dev.ps1"

jobs:
  bootstrap-baseline:
    runs-on: windows-latest
    env:
      GOODQ_DATA_ROOT: ${{ github.workspace }}\_ci\GoodQ_Data
      GOODQ_HOST_PROFILE: BASELINE
      GOODQ_REQUIRE_GPU: "0"
      GOODQ_REQUIRE_WSL_AUDIO: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare CI data root
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:GOODQ_DATA_ROOT" | Out-Null

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: goodq_core
          auto-activate: false
          environment-file: environment.yml

      - name: Documentation drift lint
        shell: pwsh
        run: conda run -n goodq_core python scripts/docs/doc_drift_lint.py

      - name: Dependency drift lint
        shell: pwsh
        run: conda run -n goodq_core python scripts/docs/dependency_drift_lint.py

      - name: Banned token lint
        shell: pwsh
        run: conda run -n goodq_core python scripts/docs/banned_token_lint.py

      - name: Bootstrap verification
        shell: pwsh
        run: conda run -n goodq_core python scripts/bootstrap_verify.py --json --profile ci

      - name: Unit test suite
        shell: pwsh
        run: conda run -n goodq_core python -m pytest -q
