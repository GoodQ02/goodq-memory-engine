name: dependency-review

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4

  main-branch-status:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm dependency review gate is configured
        run: |
          echo "Dependency review is enforced on pull requests."
          echo "This main-branch status keeps the public badge tied to an active workflow."
