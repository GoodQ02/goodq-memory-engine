name: dependency-review

on:
  pull_request:
    paths:
      - "environment.yml"
      - "environment.gpu.yml"
      - "environment-baseline-lock.yml"
      - "setup.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "api/requirements.txt"
      - "envs/**/requirements.txt"
      - "wsl2_audio/requirements*.txt"

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
