name: dependency-review

on:
  pull_request:
    paths:
      - "environment.yml"
      - "environment.gpu.yml"
      - "setup.py"
      - "wsl2_audio/requirements*.txt"

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
