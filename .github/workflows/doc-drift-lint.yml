name: doc-drift-lint

on:
  push:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/doc-drift-lint.yml"
      - "*.md"
      - "docs/**"
      - "AGENTS.md"
      - "scripts/docs/doc_drift_lint.py"
      - "scripts/docs/doc_authority_lint.py"
  pull_request:
    paths:
      - ".github/workflows/doc-drift-lint.yml"
      - "*.md"
      - "docs/**"
      - "AGENTS.md"
      - "scripts/docs/doc_drift_lint.py"
      - "scripts/docs/doc_authority_lint.py"
  workflow_dispatch:

jobs:
  docs-drift-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run doc drift lint
        run: python scripts/docs/doc_drift_lint.py

      - name: Run documentation authority lint
        run: python scripts/docs/doc_authority_lint.py verify
