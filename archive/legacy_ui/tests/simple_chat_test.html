<!DOCTYPE html>
<html>
<head>
    <title>GoodQ Chat Test - Ultra Simple</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1a1a; color: #fff; }
        input { padding: 10px; width: 400px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #response { background: #2a2a2a; padding: 15px; margin-top: 20px; border: 1px solid #4a4a4a; }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
    </style>
</head>
<body>
    <h1>Ultra Simple Chat Test</h1>
    <p>Type your question and click Send</p>
    
    <input type="text" id="messageInput" placeholder="Type your message..." value="how many scenes">
    <button onclick="sendMessage()">Send</button>
    <button onclick="clearResponse()">Clear</button>
    
    <div id="response"></div>

    <script>
        const responseDiv = document.getElementById('response');
        
        function log(msg, type = 'info') {
            const p = document.createElement('p');
            p.className = type;
            p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            responseDiv.appendChild(p);
            console.log(msg);
        }
        
        function clearResponse() {
            responseDiv.innerHTML = '';
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) {
                log('Please enter a message', 'error');
                return;
            }
            
            log(`Sending: "${message}"`, 'info');
            
            // Exact format that works in PowerShell
            const requestBody = {
                message: message,
                context: { mode: "natural" }
            };
            
            log(`Request body: ${JSON.stringify(requestBody)}`, 'info');
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                log(`Response status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                if (!response.ok) {
                    const errorText = await response.text();
                    log(`Error response: ${errorText}`, 'error');
                    return;
                }
                
                const data = await response.json();
                log(`SUCCESS!`, 'success');
                log(`Message: ${data.message}`, 'success');
                
                if (data.suggestions) {
                    log(`Suggestions: ${data.suggestions.join(', ')}`, 'info');
                }
                
            } catch (error) {
                log(`ERROR: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        }
        
        // Allow Enter key to send
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        
        // Test on load
        window.onload = () => {
            log('Page loaded - ready to test', 'success');
            log('Press Enter or click Send to test the API', 'info');
        };
    </script>
</body>
</html>
