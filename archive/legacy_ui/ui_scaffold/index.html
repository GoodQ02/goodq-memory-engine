<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodQ4All - Multimodal Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="gradient-bg text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold">🧠 GoodQ4All</h1>
                    <span class="ml-4 text-sm opacity-90">Multimodal Intelligence Engine</span>
                </div>
                <div class="flex space-x-4">
                    <a href="#search" class="hover:bg-white/20 px-3 py-2 rounded-md">Search</a>
                    <a href="#videos" class="hover:bg-white/20 px-3 py-2 rounded-md">Videos</a>
                    <a href="#system" class="hover:bg-white/20 px-3 py-2 rounded-md">System</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Search Section -->
        <div id="search-section" class="mb-12">
            <div class="bg-white rounded-lg shadow-md p-8">
                <h2 class="text-3xl font-bold mb-6 text-gray-800">Multimodal Search</h2>
                
                <!-- Search Bar -->
                <div class="mb-6">
                    <div class="relative">
                        <input 
                            type="text" 
                            id="search-input"
                            placeholder="Search across videos, transcripts, scenes, and more..."
                            class="w-full px-6 py-4 text-lg border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none"
                        />
                        <button 
                            id="search-btn"
                            class="absolute right-2 top-2 bg-purple-600 text-white px-6 py-2 rounded-md hover:bg-purple-700"
                        >
                            🔍 Search
                        </button>
                    </div>
                </div>

                <!-- Modality Filters -->
                <div class="flex space-x-4 mb-6">
                    <label class="flex items-center">
                        <input type="checkbox" id="text-filter" class="mr-2" checked />
                        <span>📝 Text</span>
                    </label>
                    <label class="flex items-center">
                        <input type="checkbox" id="visual-filter" class="mr-2" checked />
                        <span>🎨 Visual</span>
                    </label>
                    <label class="flex items-center">
                        <input type="checkbox" id="audio-filter" class="mr-2" />
                        <span>🎵 Audio</span>
                    </label>
                </div>

                <!-- Results Container -->
                <div id="search-results" class="mt-8">
                    <p class="text-gray-500 text-center py-8">Enter a query to search across your multimodal knowledge base</p>
                </div>
            </div>
        </div>

        <!-- System Status -->
        <div id="system-section" class="mb-12">
            <div class="bg-white rounded-lg shadow-md p-8">
                <h2 class="text-2xl font-bold mb-6 text-gray-800">System Status</h2>
                <div id="system-status">
                    <p class="text-gray-500">Loading...</p>
                </div>
            </div>
        </div>

        <!-- Videos List -->
        <div id="videos-section">
            <div class="bg-white rounded-lg shadow-md p-8">
                <h2 class="text-2xl font-bold mb-6 text-gray-800">Processed Videos</h2>
                <div id="videos-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <p class="text-gray-500">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="/ui/static/js/app.js"></script>
</body>
</html>
