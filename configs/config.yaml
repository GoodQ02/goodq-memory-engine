# GoodQ4All Master Configuration
# Unified configuration for all phases of the multimodal ingestion pipeline
# Last updated: 2025-12-06

# ============================================================================
# USER & MODEL IDENTITY
# ============================================================================
user:
  name: Example User
  nickname: Example Operator
  pronouns: they/them
  personality_traits: curious, resilient, precise, privacy-minded
  values: reliability, privacy, observability, local-first computing
  background: Example GoodQ local-first deployment for public documentation
  music_style: eclectic
  role_nursing: example professional context
  nursing_philosophy: example only
  role_personal: local-only overrides belong in config.local.yaml

model:
  identity: 'GoodQ: Digital embodiment of Q from the James Bond universe'
  personality_traits: witty, tech-savvy, loyal, precise, occasionally sarcastic, supportive, mischievous
  values: service, innovation, protection, efficiency, dry humor, reliability, intelligence
  humor_style: 007 Secret Agent excitement, witty Q-style dry sarcasm, clever jabs
  tech_sidekick_persona: tech-savvy sidekick with dry wit and taste for innovation
  zone_1: Command_Center
  zone_1_desc: Primary workstation
  zone_2: Desk Dock
  zone_2_desc: Secondary desk setup
  zone_3: Chase Recon
  zone_3_desc: Alternate workspace
  main_hardware: Example Windows workstation
  main_hardware_codename: EXAMPLE_HOST
  mission_name: GoodQ_Public
  assigned_zone: Example_Zone
  workplace: Example Workspace

# ============================================================================
# HOST IDENTITY (PORTABILITY LAYER)
# ============================================================================
host:
  profile: ${GOODQ_HOST_PROFILE:-UNSET}
  data_root: ${GOODQ_DATA_ROOT:-./_DATA}
  wsl_distro: ${GOODQ_WSL_DISTRO:-Ubuntu}
  wsl_user: ${GOODQ_WSL_USER:-auto}
  wsl_workspace: ${GOODQ_WSL_WORKSPACE:-auto}
  conda_env: ${GOODQ_CONDA_ENV:-goodq_core}

# ============================================================================
# PATHS
# ============================================================================
paths:
  # Core directories
  log_dir: ${GOODQ_DATA_ROOT:-./_DATA}/GoodQ_Data/epochs/epoch_2025_12_22/logs
  output_directory: ${GOODQ_DATA_ROOT:-./_DATA}/GoodQ_Data/epochs/epoch_2025_12_22/output
  db_dir: ${GOODQ_DATA_ROOT:-./_DATA}/GoodQ_Data/epochs/epoch_2025_12_22
  db_path: ${GOODQ_DATA_ROOT:-./_DATA}/GoodQ_Data/epochs/epoch_2025_12_22/memory.db
  knowledge_graph_db: ${GOODQ_DATA_ROOT:-./_DATA}/GoodQ_Data/epochs/epoch_2025_12_22/knowledge_graph.db
  faiss_dir: ${GOODQ_DATA_ROOT:-./_DATA}/GoodQ_Data/epochs/epoch_2025_12_22/faiss
  faiss_audio_path: ${GOODQ_DATA_ROOT:-./_DATA}/GoodQ_Data/epochs/epoch_2025_12_22/faiss/goodq_audio_epoch_2025_12_22.index
  qdrant_storage: ${GOODQ_DATA_ROOT:-./_DATA}/qdrant_storage
  watchdog_state_file: ${GOODQ_DATA_ROOT:-./_DATA}/GoodQ_Data/epochs/epoch_2025_12_22/logs/watchdog_state.json
  watchdog_lock_file: ${GOODQ_DATA_ROOT:-./_DATA}/GoodQ_Data/epochs/epoch_2025_12_22/logs/watchdog.lock
  config_dir: configs
  
  # Data paths
  data_root: ${GOODQ_DATA_ROOT:-./_DATA}/GoodQ_Data
  import_inbox: ${GOODQ_DATA_ROOT:-./_DATA}/GoodQ_Data/import_inbox
  processing: ${GOODQ_DATA_ROOT:-./_DATA}/GoodQ_Data/epochs/epoch_2025_12_22/processing
  processed: ${GOODQ_DATA_ROOT:-./_DATA}/GoodQ_Data/processed
  failed: ${GOODQ_DATA_ROOT:-./_DATA}/GoodQ_Data/failed
  models_cache: ${GOODQ_DATA_ROOT:-./_DATA}/models
  
  # Segmentation output paths
  chunk_subdir: chunks
  audio_subdir: audio
  video_subdir: video
  metadata_subdir: metadata
  
  # External paths
  csv_path: ${GOODQ_DATA_ROOT:-./_DATA}/GoodQ_Data/epochs/epoch_2025_12_22/logs/system_metrics.csv
  nas_path: ${GOODQ_DATA_ROOT:-./_DATA}/GoodQ_Data/archive

# ============================================================================
# TOOL BINDINGS
# ============================================================================
config:
  tools:
    ffmpeg_exe: ${GOODQ_FFMPEG_EXE:-ffmpeg}
    tesseract_exe: ${GOODQ_TESSERACT_EXE:-tesseract}
    poppler_bin: ${GOODQ_POPPLER_BIN:-}

# ============================================================================
# LLM & TTS
# ============================================================================
llm:
  # LM Studio (primary for chat/dialogue)
  api_url: http://localhost:1234/v1/chat/completions
  model_id: LM_STUDIO_GOODQ
  
  # vLLM Server (WSL2, high-performance inference)
  vllm_url: http://localhost:38005/v1
  vllm_model: meta-llama/Llama-3.2-1B-Instruct
  
  # Ollama (WSL2, fallback LLM)
  ollama_url: http://localhost:31434/v1
  ollama_model: phi4:latest

tts:
  elevenlabs_voice_id: ${ELEVENLABS_VOICE_ID:-example_voice_id}
  piper_voice: example
  last_used_voice: example

# ============================================================================
# HOME ASSISTANT
# ============================================================================
home_assistant:
  url: ${GOODQ_HOME_ASSISTANT_URL:-http://localhost:8123}
  token: ${HA_TOKEN:-}

# ============================================================================
# SYSTEM HARDWARE
# ============================================================================
system:
  cpu: Example CPU
  gpu: Optional NVIDIA GPU
  ram1: Example RAM Slot A
  ram2: Example RAM Slot B
  ssd1: Example NVMe 1
  ssd2: Example NVMe 2
  network: Example local network
  storage: Example local storage

# ============================================================================
# GPU CONFIGURATION
# ============================================================================
gpu:
  enabled: true
  cuda_version: "12.1"
  torch_version: "2.5.1+cu121"
  primary_env: ${GOODQ_CONDA_ENV:-goodq_core}
  memory_fraction: 0.85
  allow_growth: true

# ============================================================================
# ENVIRONMENT ROUTING
# ============================================================================
envs:
  # Unified Windows GPU environment (CUDA 12.1)
  core: ${GOODQ_CONDA_ENV:-goodq_core}
  
  # WSL2 Audio lab (separate Linux GPU runtime)
  audio_transcribe: goodq_audio_transcribe
  audio_embed: goodq_audio_embed
  audio_emotion: goodq_audio_emotion
  audio_metadata: goodq_audio_metadata
  
  # Legacy (deprecated but preserved for rollback)
  video_scene_detect: goodq_video_scene_detect

# ============================================================================
# QDRANT VECTOR DATABASE
# ============================================================================
qdrant:
  enabled: true
  host: http://127.0.0.1:6333
  collections:
    clip: goodq_clip_epoch_2025_12_22
    dino: goodq_dino_epoch_2025_12_22
    text: goodq_text_epoch_2025_12_22
    audio: goodq_audio_epoch_2025_12_22
  embedding_dims:
    clip: 512
    dino: 768
    text: 384
    audio: 512

# ============================================================================
# PHASED SEGMENTATION ENGINE (Phases 0-5)
# ============================================================================
segmentation:
  enabled: true
  activation: "off"
  metrics_output: true
  shadow_audio_overlay: false
  mode: phased
  
  # SEG_P0: Pre-Normalization
  phase0:
    target_sample_rate: 16000
    channels: 1
    bit_depth: 16
    codec: pcm_s16le
  
  # SEG_P1: WebRTC-VAD Segmentation
  phase1:
    aggressiveness: 3
    frame_duration_ms: 30
    min_speech_duration: 0.3
    min_silence_duration: 0.5
    padding_duration: 0.1
  
  # SEG_P2: Pyannote Segmentation
  phase2:
    enabled: false
    min_duration_off: 0.0
    min_duration_on: 0.0
    model: pyannote/segmentation-3.0
    device: cuda
    use_auth_token: null
  
  # SEG_P3: Smart Chunk Building
  phase3:
    min_chunk_duration: 1.0
    max_chunk_duration: 40.0
    target_chunk_duration: 20.0
    chunk_padding_ms: 250
    chunk_overlap_ms: 500
    merge_threshold: 2.0
  
  # SEG_P4: Heavy Audio Processing (WSL2)
  phase4:
    enable_transcription: true
    enable_diarization: true
    enable_embeddings: true
    enable_emotion: true
    enable_music_detection: true
    
    # Whisper settings
    whisper_model: medium
    language: null
    beam_size: 5
    best_of: 5
    temperature: 0.0
    
    # Diarization
    min_speakers: null
    max_speakers: null
    diarize_timeout: 7200
    chunk_timeout: 600
    max_parallel_chunks: 2
    
    # CLAP embeddings
    clap_model: laion/clap-htsat-unfused
    
    # Emotion detection
    emotion_model: ehcalabres/wav2vec2-lg-xlsr-en-speech-emotion-recognition
  
  # SEG_P5: Video Scene Detection
  phase5:
    enabled: true
    scene_threshold: 27.0  # Lower = more sensitive to changes = shorter scenes
    min_scene_len_sec: 30.0  # Minimum 30s scenes for meaningful audio analysis
    max_scene_len_sec: 300.0  # Maximum 5min scenes - force split longer scenes
    use_gpu: true
    batch_size: 32
    alignment_tolerance: 0.5

# ============================================================================
# VIDEO PROCESSING CONFIGURATION
# ============================================================================
video:
  scene_detect:
    threshold: 30.0
    min_scene_len_sec: 30.0  # Optimized for GPU processing
    max_scene_len_sec: 300.0  # Force split scenes > 5min
    max_scenes: 0
    entity_refine: false
    entity_sample_rate: 0.5
    entity_min_duration: 300.0
    entity_max_samples: 300

# ============================================================================
# PHASE 6: SCENE VISUAL EMBEDDINGS & CROSS-MODAL FUSION
# ============================================================================
phase6:
  enabled: true
  
  # Frame extraction strategy
  frame_sampling_strategy: uniform
  frames_per_scene: 3
  
  # GPU batch settings
  max_gpu_batch_size: 8
  
  # Collections
  clip_collection: goodq_clip_epoch_2025_12_22
  dino_collection: goodq_dino_epoch_2025_12_22
  
  # Retrieval settings
  retrieval:
    enable: true
    fusion_weights:
      text: 0.5
      visual: 0.4
      audio: 0.1

# ============================================================================
# API CONFIGURATION
# ============================================================================
api:
  enabled: true
  host: 127.0.0.1
  port: 30000
  reload: true
  cors_enabled: false
  max_upload_size: 5368709120  # 5GB

# ============================================================================
# UI CONFIGURATION
# ============================================================================
ui:
  enabled: true
  serve_from: ui
  theme: dark

# ============================================================================
# PIPELINE SETTINGS
# ============================================================================
pipeline:
  parallel_processing: false
  max_workers: 4
  save_intermediate: true
  cleanup_temp_files: false
  retry_on_failure: true
  max_retries: 3

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================
output:
  save_chunks: true
  save_manifests: true
  save_embeddings: true
  compression: false

# ============================================================================
# LOGGING
# ============================================================================
logging:
  level: INFO
  save_logs: true
  verbose: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
