user:
  name: Joes Domingo, Agent Domingo, Joe, Agent Joes, Double 007
  location: Chicago, IL
  values: Accuracy, creativity, empathy, efficiency
  personality_traits: Witty, friendly, professional, concise
model:
  goodq_values: clarity, precision, humor, loyalty
llm:
  # Unified API endpoint (main.py serves all LLM routes)
  api_url: http://localhost:30000/api/chat
  # Model selection handled by LLMClient fallback chain
  model_id: auto  # Uses best available: vLLM Llama-1B or Ollama Phi4
  timeout: 30
  temperature: 0.7
  features:
    scene_summarization: true
    video_summarization: true
    intelligent_tagging: true
    context_analysis: true
    emotional_arc_analysis: true
    relationship_mapping: true
tts:
  engine: elevenlabs
  voice_id: goT3UYdM9bhm0n2lmKQx
  piper_exe: L:\_TOOLS\piper\piper.exe
  voice_path: L:\_TOOLS\piper\en_US-libritts-high.onnx
  out_dir: L:\_TOOLS\piper
ha:
  url: http://192.168.0.154:8123
tools:
  root: L:\_TOOLS
  piper_exe: L:\_TOOLS\piper\piper.exe
  piper_voice: L:\_TOOLS\piper\en_US-libritts-high.onnx
  tesseract_exe: L:\_TOOLS\tesseract\tesseract.exe
  ffmpeg_exe: L:\_TOOLS\ffmpeg\bin\ffmpeg.exe
  poppler_bin: L:\_TOOLS\poppler\bin
  pdftotext_exe: L:\_TOOLS\poppler\bin\pdftotext.exe
  whisper_cli: L:\_TOOLS\whisper\whisper-cli.exe
  whisper_ggml_model: L:\_TOOLS\whisper\ggml-large-v3.bin
models:
  yolo_model_path: L:\_DATA\models\vision\yolo\yolov8n.pt
  lexicons:
    nrc_emotion_dir: L:\_DATA\models\lexicons\NRC-Emotion-Lexicon
analysis:
  use_nrc_lexicon: false
video:
  scene_detect:
    threshold: 30.0
    min_scene_len_sec: 300.0
    max_scenes: 100
    entity_refine: false
    entity_sample_rate: 0.25
    entity_min_duration: 300.0
    entity_max_samples: 300
  scene_threshold: 0.3
  scene_threshold_overrides:
    by_extension: {}
    by_path_substring: {}
tagger:
  ner_model: dslim/bert-base-NER
audio:
  diarization:
    token_env: PYANNOTE_TOKEN
    model: pyannote/speaker-diarization@2.1
    min_speakers: 1
    max_speakers: 10
    vad_enabled: true
    vad_threshold: 0.5
    vad_min_speech_ms: 400
    vad_min_silence_ms: 200
    vad_merge_gap_seconds: 1.0
  events:
    enabled: true
    min_confidence: 0.6
    patterns:
    - label: birthday_song
      regex: \bhappy\s+birthday\b
    - label: christmas
      regex: \b(christmas|jingle\s+bells|silent\s+night|merry\s+christmas)\b
    - label: halloween
      regex: \b(halloween|trick\s+or\s+treat)\b
    - label: new_year
      regex: \b(new\s+year|countdown)\b
    - label: wedding
      regex: \b(wedding|here\s+comes\s+the\s+bride)\b
    - label: applause
      regex: \b\[?applause\]?\b
    - label: laughter
      regex: \b\[?laughter\]?\b
    - label: singing
      regex: \bsinging\b
  time_hints:
    enabled: true
    normalize_date_formats: true
    relative_phrases:
    - today
    - yesterday
    - tomorrow
    - last night
    - last week
    - this morning
    - this evening
    - next week
  transcribe:
    model: medium
    chunk_seconds: 30
    language: en
    beam_size: 5
    vad_filter: true
    initial_prompt: Home video recording with family conversations, background music,
      and ambient sounds.
faiss:
  index_type: Flat
  metric: cosine
  normalize: true
memory:
  max_summaries_per_video: 5000
  retention_days: 365
  auto_vacuum: true
  vacuum_interval_days: 30
processing:
  batch_size_images: 8
  batch_size_audio: 4
  max_workers: 1
  gpu_memory_fraction: 0.8
  enable_amp: false
knowledge_graph:
  enabled: true
  min_confidence: 0.6
  max_hops: 3
  entity_deduplication: true
  similarity_threshold: 0.85
steps:
  audio_extraction:
    skip_on_error: true

# Phase 6: Scene Visual Embeddings & Multimodal Fusion
phase6:
  enabled: true
  frame_sampling_strategy: uniform  # Options: uniform, keyframe, middle
  frames_per_scene: 3
  pooling_strategy: mean  # Options: mean, max, concat, attention
  max_gpu_batch_size: 8
  clip_collection: goodq_clip_scenes
  dino_collection: goodq_dino_scenes
  retrieval:
    enable: true
    fusion_weights:
      text: 0.5
      visual: 0.4
      audio: 0.1
