# Declarative installer profile authority.  Selection is resolved from the
# sealed asset catalog; no installer may add an undeclared payload.
schema_version: 1
profiles:
  PUBLIC_CPU_BASELINE:
    distribution: public
    include_packs:
      - core_cpu
      - vision_cpu
      - audio_cpu
      - object_detection_cpu
      - face_identity_cpu
      - ocr_cpu
      - document_cpu
      - service_cpu
    capability_dispositions:
      local_vlm: {status: policy_excluded}
      local_llm_serving: {status: policy_excluded}
    component_dispositions:
      gpu_enhanced: {status: excluded}
      wsl_audio: {status: excluded}
  PUBLIC_GPU_ENHANCED:
    distribution: public
    extends: PUBLIC_CPU_BASELINE
    expected_asset_count: 33
    forbidden_assets:
      - qwen2_5_vl_7b
      - qwen2_5_vl_3b
      - deepseek_r1_distill_qwen_14b
      - deepseek_r1_distill_qwen_7b
      - gemma_4_12b_unified
    include_packs:
      - audio_gpu
      - object_detection_gpu
    component_dispositions:
      gpu_enhanced: {status: included}
  PERSONAL_AIR_GAP:
    distribution: personal
    extends: PUBLIC_GPU_ENHANCED
    acceptance_required: true
    expected_asset_count: 36
    include_packs:
      - audio_optional
    component_dispositions:
      wsl_audio:
        status: host_prerequisite
        distro: Ubuntu-22.04
        wsl_version: 2
        receipt_phases: [pre_install, post_install]
        probe: scripts/wsl_audio_preflight.py
        required_checks:
          - workspace
          - transcription
          - process_import
          - abi
          - diarization
          - wav2vec_enrichment
          - clap_handoff
          - gpu
        allowed_warnings: [torchcodec_unavailable]
        packaged: false

# Every asset admitted by the v3.0.1 GPU selectors has one runtime owner and
# one deterministic pre/post-install probe.  The resolved profile ledger is
# embedded in the signed selected-capabilities receipt.
