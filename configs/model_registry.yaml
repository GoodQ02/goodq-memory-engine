datasets: null
system_tools:
  ffmpeg:
    name: FFmpeg
    version: '6.1'
    binary_path: '@config.tools.ffmpeg_exe'
    required: true
    verify_command: ffmpeg -version
  tesseract:
    name: Tesseract OCR
    version: 5.3.0
    binary_path: '@config.tools.tesseract_exe'
    required: true
    verify_command: tesseract --version
  poppler:
    name: Poppler PDF Tools
    version: 23.08.0
    binary_path: '@config.tools.poppler_bin'
    required: true
    verify_command: pdftotext -v
verification:
  check_sha256: true
  check_file_size: true
  allow_cache: true
  offline_mode: false
update_policy:
  auto_update: false
  security_updates_only: false
  manual_approval_required: true
  check_for_updates: false
backup:
  enabled: true
  snapshot_on_install: true
  snapshot_dir: '@paths.models_cache/snapshots'
  retention_days: 90
