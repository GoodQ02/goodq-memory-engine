# GoodQ4All LLM Models Configuration
# This file defines all available LLM models for the system

# GPU VRAM budget limits (especially for Windows WDDM environments)
gpu_budget:
  total_vram_gb: 16.0
  reserved_display_gb: 1.5
  reserved_cuda_fragmentation_gb: 1.0
  usable_target_gb: 13.5
  emergency_stop_gb: 14.5

models:
  # Fast inference model (vLLM on WSL2) - Stable Default
  llama1b_speed:
    name: "Qwen-0.5B-Speed"
    base_url: "http://localhost:38005/v1"
    model_id: "${GOODQ_WSL_MODEL_PATH:-/home/jdben/models/Qwen2.5-0.5B-Instruct}"
    engine: "vllm"
    category: "speed"
    gpu_accelerated: true
    max_tokens: 8192
    temperature: 0.7
    description: "Fast local model for quick responses"
    
  # Balanced model (Ollama) - Stable Default
  phi4_ollama:
    name: "Phi4-Ollama"
    base_url: "http://localhost:11434/v1"
    model_id: "phi4"
    engine: "ollama"
    category: "balanced"
    gpu_accelerated: true
    max_tokens: 16384
    temperature: 0.7
    description: "Microsoft Phi-4 via Ollama for quality responses"

  # SOTA Candidate: DeepSeek R1 14B Distilled
  deepseek_r1_14b:
    name: "DeepSeek-R1-Distill-Qwen-14B"
    base_url: "http://localhost:11434/v1"
    model_id: "deepseek-r1:14b"
    engine: "ollama"
    category: "reasoning"
    gpu_accelerated: true
    vram_gb: 9.5
    max_tokens: 16384
    temperature: 0.6
    description: "DeepSeek R1 14B Q4_K_M for heavy reasoning tasks"

  # SOTA Candidate: DeepSeek R1 7B Distilled
  deepseek_r1_7b:
    name: "DeepSeek-R1-Distill-Qwen-7B"
    base_url: "http://localhost:11434/v1"
    model_id: "deepseek-r1:7b"
    engine: "ollama"
    category: "reasoning"
    gpu_accelerated: true
    vram_gb: 5.0
    max_tokens: 16384
    temperature: 0.6
    description: "DeepSeek R1 7B for interactive light reasoning"

  # SOTA Candidate: Qwen2.5 VL 7B (Vision)
  qwen2_5_vl_7b:
    name: "Qwen2.5-VL-7B-Instruct"
    base_url: "http://localhost:38005/v1"
    model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
    engine: "vllm"
    category: "vision"
    gpu_accelerated: true
    max_tokens: 4096
    temperature: 0.2
    description: "SOTA VL model for scene analysis and OCR"

  # SOTA Candidate: Qwen2.5 VL 3B (Vision)
  qwen2_5_vl_3b:
    name: "Qwen2.5-VL-3B-Instruct"
    base_url: "http://localhost:11434/v1"
    model_id: "qwen2.5-vision:3b"
    engine: "ollama"
    category: "vision"
    gpu_accelerated: true
    max_tokens: 4096
    temperature: 0.2
    description: "Lightweight VLM for concurrent desktop usage"

  # Active Windows GPU chat model; served locally by the configured Ollama host.
  hermes_gemma4_64k:
    name: "Hermes-Gemma4-64K"
    base_url: "http://127.0.0.1:31434/v1"
    model_id: "hermes-gemma4-64k:12b"
    engine: "ollama"
    category: "chat"
    gpu_accelerated: true
    vram_gb: 12.0
    max_tokens: 65536
    temperature: 0.7
    request_options:
      think: false
    description: "Local Hermes Gemma 4 chat model with non-thinking request mode"

  # Experimental: Gemma 4 Unified (Disabled by default, opt-in only)
  gemma_4_experimental:
    name: "Gemma-4-12B-it-Experimental"
    base_url: "http://localhost:11434/v1"
    model_id: "gemma4:12b"
    engine: "ollama"
    category: "multimodal"
    gpu_accelerated: true
    max_tokens: 8192
    temperature: 0.7
    enabled: false
    requires_license_acceptance: true
    description: "Unified multimodal Gemma 4 candidate (opt-in only)"

# Model selection strategies (Defaults remain unchanged)
strategies:
  prefer_speed:
    primary: "llama1b_speed"
    fallback: "phi4_ollama"
    
  prefer_quality:
    primary: "phi4_ollama"
    fallback: "llama1b_speed"
    
  default: "prefer_speed"

# Hardened VRAM Profiles (Opt-In)
profiles:
  GPU_ENHANCED:
    chat: "hermes_gemma4_64k"
    load_policy: "sequential_only"
    concurrency_allowed: false
    estimated_vram_peak_gb: 12.0

  GPU_16GB_INGEST_QUALITY:
    reasoning: "deepseek_r1_14b"
    vision: "qwen2_5_vl_7b"
    audio: "whisper_large_v3_turbo"
    load_policy: "sequential_only"
    concurrency_allowed: false
    estimated_vram_peak_gb: 9.5
    
  GPU_16GB_INTERACTIVE_LIGHT:
    reasoning: "deepseek_r1_7b"
    vision: "qwen2_5_vl_3b"
    audio: "whisper_large_v3_turbo"
    load_policy: "concurrent_safe"
    concurrency_allowed: true
    estimated_vram_peak_gb: 10.6

# Health check settings
health:
  enabled: false  # Disable healthchecks during ingestion
  check_interval_seconds: 30
  timeout_seconds: 10
  retry_attempts: 3
  
# Usage quotas
quotas:
  requests_per_minute: 60
  tokens_per_day: 1000000
