# Phase 4: Heavy Audio Processing Configuration
# 
# Controls GPU-accelerated audio processing for segmented chunks.
# All processing routes through WSL2 audio bridge.

audio:
  # Transcription settings (Faster-Whisper via WSL2)
  transcribe:
    language: null  # null = auto-detect, or specify: "en", "es", "fr", etc.
    task: "transcribe"  # "transcribe" or "translate" (to English)
    beam_size: 5  # Beam search size (1-10, higher = more accurate but slower)
    
  # Diarization settings (Pyannote via WSL2)
  diarize:
    timeout: 7200  # 2 hours for full diarization
    
  # Per-chunk processing timeout
  chunk_timeout: 600  # 10 minutes per chunk
  
  # Parallel processing
  max_parallel_chunks: 2  # How many chunks to process simultaneously
                          # Increase if GPU memory allows
                          # Decrease if running out of VRAM
  
  # Future extension points (not yet implemented)
  # embeddings:
  #   model: "clap-laion-music"  # CLAP model for audio embeddings
  #   
  # emotion:
  #   enabled: true
  #   
  # music_detection:
  #   enabled: true
  #   threshold: 0.5

