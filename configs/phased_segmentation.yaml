# Phased Segmentation Engine Configuration
# Complete settings for all 6 phases of video/audio processing

# Phase 0: Pre-Normalization
phase0:
  target_sample_rate: 16000  # Hz - standard for Whisper/speech models
  channels: 1                # Mono audio
  bit_depth: 16              # 16-bit PCM
  codec: 'pcm_s16le'         # Lossless codec

# Phase 1: WebRTC-VAD Segmentation
phase1:
  aggressiveness: 3          # 0-3, higher = more aggressive filtering
  frame_duration_ms: 30      # Frame duration (10, 20, or 30 ms)
  min_speech_duration: 0.3   # Minimum speech segment duration (seconds)
  min_silence_duration: 0.5  # Minimum silence to trigger segment split (seconds)
  padding_duration: 0.1      # Padding around speech segments (seconds)

# Phase 2: Pyannote Segmentation
phase2:
  min_duration_off: 0.0      # Minimum off-time for activity detection
  use_auth_token: null       # Hugging Face auth token (if needed)
  device: 'cuda'             # 'cuda' or 'cpu'
  
# Phase 3: Smart Chunk Building
phase3:
  max_chunk_duration: 40.0   # Maximum chunk duration (seconds)
  min_chunk_duration: 1.0    # Minimum chunk duration (seconds)
  target_chunk_duration: 20.0 # Target chunk duration (seconds)
  padding_sec: 0.25          # Padding at chunk boundaries (seconds)
  overlap_sec: 0.5           # Overlap between chunks (seconds)
  merge_threshold: 2.0       # Merge chunks shorter than this (seconds)

# Phase 4: Audio Processing (WSL2)
phase4:
  # Feature flags
  enable_transcription: true
  enable_diarization: true
  enable_embeddings: true
  enable_emotion: true
  enable_music_detection: true
  
  # Whisper settings
  whisper_model: 'medium'    # tiny, base, small, medium, large
  language: null             # null for auto-detect, or 'en', 'es', etc.
  beam_size: 5               # Beam search width
  best_of: 5                 # Number of candidates
  temperature: 0.0           # Sampling temperature (0 = greedy)
  
  # Diarization settings
  min_speakers: null         # Minimum speakers (null for auto)
  max_speakers: null         # Maximum speakers (null for auto)
  
  # CLAP embedding settings
  clap_model: 'laion/clap-htsat-fused'
  
  # Emotion detection
  emotion_model: 'ehcalabres/wav2vec2-lg-xlsr-en-speech-emotion-recognition'

# Phase 5: Video Scene Detection  
phase5:
  scene_threshold: 30.0      # Scene change threshold (0-100, higher = fewer scenes)
  min_scene_len_sec: 2.0     # Minimum scene length (seconds)
  use_gpu: true              # Use GPU acceleration for scene detection
  batch_size: 32             # Frames per GPU batch
  alignment_tolerance: 0.5   # Time tolerance for scene/audio alignment (seconds)

# Pipeline settings
pipeline:
  parallel_processing: false  # Process chunks in parallel (experimental)
  max_workers: 4             # Max parallel workers
  save_intermediate: true    # Save intermediate results
  cleanup_temp_files: false  # Delete temp files after processing
  
# Output settings
output:
  save_chunks: true          # Save individual chunk WAV files
  save_manifests: true       # Save JSON manifests for each phase
  save_embeddings: true      # Save embedding vectors
  compression: false         # Compress output files

# Logging
logging:
  level: 'INFO'              # DEBUG, INFO, WARNING, ERROR
  save_logs: true            # Save logs to file
  verbose: true              # Print detailed progress
