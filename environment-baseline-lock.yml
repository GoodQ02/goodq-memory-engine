# Authoritative Conda environment lockfile for GoodQ4All CPU-safe baseline.
# Generated from verified active runtime environment.
name: goodq_core
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10.20
  - pip=26.0.1
  - numpy=2.2.6
  - pandas=2.3.3
  - pyyaml=6.0.3
  - python-dotenv=1.2.2
  - requests=2.33.0
  - fastapi=0.135.2
  - uvicorn=0.42.0
  - typer=0.24.0
  - pytest=9.0.2
  - pytorch=2.5.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - cpuonly
  - imageio-ffmpeg=0.6.0
  - pip:
      - -e .
      - "goodq-mini-agent==0.1.1"
      - transformers==5.4.0
      - sentence-transformers==5.3.0
      - qdrant-client==1.17.1
      - faster-whisper==1.2.1
      - faiss-cpu==1.9.0
      - psutil==7.2.2
      - huggingface-hub==1.8.0
      - opencv-python-headless==4.13.0.92
