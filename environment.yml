name: goodq_core
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy
  - pandas
  - pyyaml
  - python-dotenv
  - requests
  - fastapi
  - uvicorn
  - typer
  - pytest
  - pytorch
  - torchvision
  - torchaudio
  - cpuonly
  - imageio-ffmpeg
  - pip:
      - -e .
      - transformers
      - sentence-transformers
      - qdrant-client
      - faster-whisper
#
# Public BASELINE environment only.
# GPU_ENHANCED uses environment.gpu.yml to add CUDA-backed throughput packages.
# Specialized step environments remain under envs/*/requirements.txt
# and envs/locks/*.lock.txt for GPU/WSL and model-specific workloads.
