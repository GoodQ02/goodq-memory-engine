<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene Explorer - GoodQ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-bg: #0a0e27;
            --secondary-bg: #151b3d;
            --accent-bg: #1e2749;
            --primary-text: #e0e6ff;
            --secondary-text: #8b92b8;
            --accent-color: #5b7cff;
            --success-color: #4ade80;
            --warning-color: #fbbf24;
            --error-color: #ef4444;
            --border-color: #2a3558;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--primary-bg);
            color: var(--primary-text);
            min-height: 100vh;
        }

        .header {
            background: var(--secondary-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-color), #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            background: var(--accent-bg);
            color: var(--primary-text);
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--accent-color);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        .scene-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .scene-card {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .scene-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
            box-shadow: 0 8px 16px rgba(91, 124, 255, 0.2);
        }

        .scene-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .scene-number {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .scene-duration {
            font-size: 12px;
            color: var(--secondary-text);
            background: var(--accent-bg);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .scene-summary {
            font-size: 14px;
            line-height: 1.6;
            color: var(--secondary-text);
            margin-bottom: 15px;
        }

        .scene-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .meta-tag {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            background: var(--accent-bg);
            color: var(--primary-text);
        }

        .emotion-tag {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--secondary-text);
        }

        .scene-detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            overflow-y: auto;
        }

        .scene-detail-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .scene-detail-content {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .scene-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
        }

        .close-btn {
            background: var(--error-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .close-btn:hover {
            background: #dc2626;
        }

        .detail-section {
            margin-bottom: 30px;
        }

        .detail-section h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .detail-section p {
            line-height: 1.6;
            color: var(--primary-text);
        }

        .entities-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .entity-tag {
            background: var(--accent-bg);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
        }

        .emotions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .emotion-item {
            background: var(--accent-bg);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .emotion-label {
            font-size: 14px;
            font-weight: 600;
        }

        .emotion-score {
            font-size: 12px;
            color: var(--secondary-text);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎬 Scene Explorer</h1>
        <a href="/" class="back-btn">← Back to Chat</a>
    </div>

    <div class="container">
        <div id="scene-count" style="font-size: 16px; color: var(--secondary-text); margin-bottom: 20px;">
            Loading scenes...
        </div>
        <div id="scene-grid" class="scene-grid">
            <div class="loading">Loading scenes...</div>
        </div>
    </div>

    <!-- Scene Detail Modal -->
    <div id="scene-detail-modal" class="scene-detail-modal">
        <div class="scene-detail-content" id="scene-detail-content">
            <!-- Content loaded dynamically -->
        </div>
    </div>

    <script>
        let allScenes = [];

        // Load scenes on page load
        async function loadScenes() {
            try {
                const response = await fetch('http://localhost:3000/api/scenes?limit=1000');
                const data = await response.json();
                
                allScenes = data.scenes || [];
                
                document.getElementById('scene-count').textContent = 
                    `Found ${allScenes.length} scenes`;
                
                renderScenes(allScenes);
            } catch (error) {
                console.error('Error loading scenes:', error);
                document.getElementById('scene-grid').innerHTML = 
                    '<div class="loading">❌ Error loading scenes. Make sure the API server is running.</div>';
            }
        }

        function renderScenes(scenes) {
            const grid = document.getElementById('scene-grid');
            
            if (scenes.length === 0) {
                grid.innerHTML = '<div class="loading">No scenes found. Process a video to see scenes here.</div>';
                return;
            }

            grid.innerHTML = scenes.map(scene => `
                <div class="scene-card" onclick="showSceneDetail(${scene.id})">
                    <div class="scene-header">
                        <div class="scene-number">Scene ${scene.scene_number + 1}</div>
                        <div class="scene-duration">${formatDuration(scene.duration)}</div>
                    </div>
                    <div class="scene-summary">
                        ${scene.summary || scene.caption || 'No description available'}
                    </div>
                    <div class="scene-meta">
                        ${formatTimestamp(scene.start)} - ${formatTimestamp(scene.end)}
                        ${scene.emotions && scene.emotions.length > 0 ? 
                            `<span class="meta-tag emotion-tag">${scene.emotions[0].label || scene.emotions[0]}</span>` : ''}
                        ${scene.has_keyframe ? '<span class="meta-tag">📷 Keyframe</span>' : ''}
                        ${scene.has_audio ? '<span class="meta-tag">🔊 Audio</span>' : ''}
                    </div>
                </div>
            `).join('');
        }

        async function showSceneDetail(sceneId) {
            try {
                const response = await fetch(`http://localhost:3000/api/scene/${sceneId}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const scene = await response.json();
                
                const modal = document.getElementById('scene-detail-modal');
                const content = document.getElementById('scene-detail-content');
                
                // Build emotions HTML
                const emotionsHtml = scene.emotions && scene.emotions.length > 0 ? `
                    <div class="detail-section">
                        <h3>😊 Detected Emotions</h3>
                        <div class="emotions-grid">
                            ${scene.emotions.map(emotion => {
                                const label = emotion.label || emotion;
                                const score = emotion.score ? (emotion.score * 100).toFixed(1) + '%' : '';
                                return `
                                    <div class="emotion-item">
                                        <div class="emotion-label">${label}</div>
                                        ${score ? `<div class="emotion-score">${score}</div>` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                ` : '';

                // Build entities HTML
                const entitiesHtml = scene.entities && scene.entities.length > 0 ? `
                    <div class="detail-section">
                        <h3>👥 Entities</h3>
                        <div class="entities-list">
                            ${scene.entities.map(entity => 
                                `<span class="entity-tag">${entity.name} (${entity.type})</span>`
                            ).join('')}
                        </div>
                    </div>
                ` : '';

                content.innerHTML = `
                    <div class="scene-detail-header">
                        <div>
                            <h2 style="font-size: 28px; margin-bottom: 10px;">Scene ${scene.scene_number + 1}</h2>
                            <p style="color: var(--secondary-text);">
                                ${formatTimestamp(scene.start)} - ${formatTimestamp(scene.end)} 
                                (${formatDuration(scene.duration)})
                            </p>
                        </div>
                        <button class="close-btn" onclick="closeSceneDetail()">Close</button>
                    </div>

                    ${scene.summary || scene.caption ? `
                        <div class="detail-section">
                            <h3>📝 Summary</h3>
                            <p>${scene.summary || scene.caption}</p>
                        </div>
                    ` : ''}

                    ${scene.transcript ? `
                        <div class="detail-section">
                            <h3>💬 Transcript</h3>
                            <p>${scene.transcript}</p>
                        </div>
                    ` : ''}

                    ${emotionsHtml}

                    ${scene.sentiment && Object.keys(scene.sentiment).length > 0 ? `
                        <div class="detail-section">
                            <h3>📊 Sentiment</h3>
                            <p>${JSON.stringify(scene.sentiment, null, 2)}</p>
                        </div>
                    ` : ''}

                    ${entitiesHtml}

                    <div class="detail-section">
                        <h3>ℹ️ Technical Details</h3>
                        <p>
                            Video Hash: ${scene.video_hash}<br>
                            Scene ID: ${scene.id}<br>
                            Has Keyframe: ${scene.has_keyframe ? 'Yes' : 'No'}<br>
                            Has Audio: ${scene.has_audio ? 'Yes' : 'No'}
                        </p>
                    </div>
                `;
                
                modal.classList.add('active');
            } catch (error) {
                console.error('Error loading scene detail:', error);
                alert('Error loading scene detail: ' + error.message);
            }
        }

        function closeSceneDetail() {
            const modal = document.getElementById('scene-detail-modal');
            modal.classList.remove('active');
        }

        function formatDuration(seconds) {
            if (!seconds) return '0s';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
        }

        function formatTimestamp(seconds) {
            if (seconds === null || seconds === undefined) return '00:00';
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            
            if (hrs > 0) {
                return `${hrs}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
            return `${mins}:${String(secs).padStart(2, '0')}`;
        }

        // Close modal when clicking outside
        document.getElementById('scene-detail-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeSceneDetail();
            }
        });

        // Load scenes when page loads
        loadScenes();
    </script>
</body>
</html>
