<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene Explorer - GoodQ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 350px 1fr;
            height: 100vh;
        }

        /* Left Sidebar - Scene List */
        .sidebar {
            background: rgba(20, 20, 40, 0.95);
            border-right: 1px solid rgba(78, 205, 196, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .sidebar-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .scene-stats {
            padding: 15px 20px;
            background: rgba(78, 205, 196, 0.1);
            border-bottom: 1px solid rgba(78, 205, 196, 0.2);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #4ecdc4;
        }

        .stat-label {
            font-size: 11px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .scene-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .scene-list::-webkit-scrollbar {
            width: 8px;
        }

        .scene-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .scene-list::-webkit-scrollbar-thumb {
            background: rgba(78, 205, 196, 0.3);
            border-radius: 4px;
        }

        .scene-list::-webkit-scrollbar-thumb:hover {
            background: rgba(78, 205, 196, 0.5);
        }

        .scene-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(78, 205, 196, 0.2);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .scene-item:hover {
            background: rgba(78, 205, 196, 0.1);
            border-color: rgba(78, 205, 196, 0.5);
            transform: translateX(5px);
        }

        .scene-item.active {
            background: rgba(78, 205, 196, 0.2);
            border-color: #4ecdc4;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.3);
        }

        .scene-time {
            font-size: 14px;
            font-weight: 700;
            color: #4ecdc4;
            margin-bottom: 5px;
        }

        .scene-duration {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 8px;
        }

        .scene-badges {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            background: rgba(78, 205, 196, 0.2);
            border: 1px solid rgba(78, 205, 196, 0.3);
        }

        /* Right Panel - Scene Details */
        .main-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 20px 30px;
            background: rgba(20, 20, 40, 0.8);
            border-bottom: 1px solid rgba(78, 205, 196, 0.3);
        }

        .panel-header h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .breadcrumb {
            font-size: 13px;
            opacity: 0.7;
        }

        .breadcrumb a {
            color: #4ecdc4;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .panel-content::-webkit-scrollbar {
            width: 10px;
        }

        .panel-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .panel-content::-webkit-scrollbar-thumb {
            background: rgba(78, 205, 196, 0.3);
            border-radius: 5px;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            border: 4px solid rgba(78, 205, 196, 0.2);
            border-top-color: #4ecdc4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            opacity: 0.7;
        }

        .empty-state-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        /* Scene Detail View */
        .detail-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(78, 205, 196, 0.2);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .detail-card h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #4ecdc4;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detail-card h3::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
            border-radius: 2px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .detail-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-label {
            font-size: 11px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: 600;
            color: #4ecdc4;
        }

        /* Emotion Chart */
        .emotion-chart {
            margin-top: 15px;
        }

        .emotion-bar {
            margin-bottom: 12px;
        }

        .emotion-bar-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 13px;
        }

        .emotion-bar-track {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .emotion-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4, #44a08d);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* Sentiment Pills */
        .sentiment-pills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .sentiment-pill {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 2px solid;
        }

        .sentiment-pill.positive {
            background: rgba(46, 213, 115, 0.2);
            border-color: #2ed573;
            color: #2ed573;
        }

        .sentiment-pill.negative {
            background: rgba(255, 71, 87, 0.2);
            border-color: #ff4757;
            color: #ff4757;
        }

        .sentiment-pill.neutral {
            background: rgba(255, 195, 18, 0.2);
            border-color: #ffc312;
            color: #ffc312;
        }

        /* Segments */
        .segment-list {
            margin-top: 15px;
        }

        .segment-item {
            background: rgba(0, 0, 0, 0.2);
            border-left: 3px solid #4ecdc4;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 0 8px 8px 0;
        }

        .segment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .segment-speaker {
            font-weight: 600;
            color: #4ecdc4;
        }

        .segment-time {
            font-size: 12px;
            opacity: 0.7;
        }

        /* Back Button */
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(78, 205, 196, 0.1);
            border: 1px solid rgba(78, 205, 196, 0.3);
            border-radius: 8px;
            color: #4ecdc4;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .back-button:hover {
            background: rgba(78, 205, 196, 0.2);
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>🎬 Scene Explorer</h1>
                <p>Your 1987-1988 Memories</p>
            </div>
            
            <div class="scene-stats">
                <div class="stat-item">
                    <div class="stat-value" id="total-scenes">0</div>
                    <div class="stat-label">Scenes</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="total-duration">0:00</div>
                    <div class="stat-label">Total Time</div>
                </div>
            </div>

            <div class="scene-list" id="scene-list">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading scenes...</p>
                </div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="main-panel">
            <div class="panel-header">
                <h2 id="panel-title">Welcome to Scene Explorer</h2>
                <div class="breadcrumb">
                    <a href="/">Home</a> / <span id="breadcrumb-current">Scenes</span>
                </div>
            </div>

            <div class="panel-content" id="panel-content">
                <div class="empty-state">
                    <div class="empty-state-icon">🎥</div>
                    <h3>Select a scene to view details</h3>
                    <p>Choose a scene from the list on the left to explore its content, emotions, and metadata.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let allScenes = [];
        let currentScene = null;

        // Format time from seconds
        function formatTime(seconds) {
            if (!seconds) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Format duration for display
        function formatDuration(seconds) {
            if (!seconds) return '0s';
            if (seconds < 60) return `${Math.round(seconds)}s`;
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return secs > 0 ? `${mins}m ${secs}s` : `${mins}m`;
        }

        // Load all scenes
        async function loadScenes() {
            try {
                console.log('📥 Loading scenes...');
                const response = await fetch(`${API_BASE}/scenes`);
                const data = await response.json();
                
                allScenes = data.scenes || [];
                console.log(`✓ Loaded ${allScenes.length} scenes`);
                
                renderSceneList();
                updateStats();
            } catch (error) {
                console.error('❌ Error loading scenes:', error);
                document.getElementById('scene-list').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h3>Error Loading Scenes</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Render scene list
        function renderSceneList() {
            const container = document.getElementById('scene-list');
            
            if (allScenes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>No Scenes Found</h3>
                        <p>Processing may still be in progress.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = allScenes.map((scene, index) => `
                <div class="scene-item" onclick="selectScene('${scene.id}')" id="scene-${scene.id}">
                    <div class="scene-time">${formatTime(scene.start)} - ${formatTime(scene.end)}</div>
                    <div class="scene-duration">Duration: ${formatDuration(scene.duration)}</div>
                    <div class="scene-badges">
                        <span class="badge">Scene ${index + 1}</span>
                        ${scene.embedding_count > 0 ? `<span class="badge">${scene.embedding_count} embeddings</span>` : ''}
                        ${scene.modalities ? scene.modalities.map(m => `<span class="badge">${m}</span>`).join('') : ''}
                    </div>
                </div>
            `).join('');
        }

        // Update statistics
        function updateStats() {
            document.getElementById('total-scenes').textContent = allScenes.length;
            
            const totalDuration = allScenes.reduce((sum, scene) => sum + (scene.duration || 0), 0);
            document.getElementById('total-duration').textContent = formatDuration(totalDuration);
        }

        // Select and load scene details
        async function selectScene(sceneId) {
            try {
                // Update active state
                document.querySelectorAll('.scene-item').forEach(item => {
                    item.classList.remove('active');
                });
                document.getElementById(`scene-${sceneId}`)?.classList.add('active');

                // Show loading
                document.getElementById('panel-content').innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading scene details...</p>
                    </div>
                `;

                // Load scene details
                const [detailResponse, emotionResponse] = await Promise.all([
                    fetch(`${API_BASE}/scenes/${sceneId}`),
                    fetch(`${API_BASE}/scenes/${sceneId}/emotions`)
                ]);

                const detailData = await detailResponse.json();
                const emotionData = await emotionResponse.json();

                currentScene = detailData.scene;
                
                console.log('✓ Scene details loaded:', currentScene);
                console.log('✓ Emotion data loaded:', emotionData);

                renderSceneDetail(currentScene, emotionData);

            } catch (error) {
                console.error('❌ Error loading scene:', error);
                document.getElementById('panel-content').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h3>Error Loading Scene</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Render scene detail view
        function renderSceneDetail(scene, emotionData) {
            const sceneIndex = allScenes.findIndex(s => s.id === scene.id) + 1;
            
            document.getElementById('panel-title').textContent = `Scene ${sceneIndex}`;
            document.getElementById('breadcrumb-current').innerHTML = `Scenes / <strong>Scene ${sceneIndex}</strong>`;

            let html = `
                <a href="javascript:clearSelection()" class="back-button">
                    ← Back to List
                </a>

                <div class="detail-card">
                    <h3>Scene Information</h3>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <div class="detail-label">Start Time</div>
                            <div class="detail-value">${formatTime(scene.start)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">End Time</div>
                            <div class="detail-value">${formatTime(scene.end)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Duration</div>
                            <div class="detail-value">${formatDuration(scene.duration)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Embeddings</div>
                            <div class="detail-value">${scene.embedding_count}</div>
                        </div>
                    </div>

                    ${Object.keys(scene.embeddings).length > 0 ? `
                        <div style="margin-top: 20px;">
                            <div class="detail-label">Embedding Breakdown</div>
                            ${Object.entries(scene.embeddings).map(([modality, count]) => `
                                <div style="display: inline-block; margin: 5px 10px 5px 0;">
                                    <span class="badge">${modality}: ${count}</span>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `;

            // Emotion data
            if (emotionData.top_emotions && emotionData.top_emotions.length > 0) {
                const maxCount = Math.max(...emotionData.top_emotions.map(e => e.count));
                
                html += `
                    <div class="detail-card">
                        <h3>Emotions Detected</h3>
                        <div class="emotion-chart">
                            ${emotionData.top_emotions.map(emotion => {
                                const percentage = (emotion.count / maxCount) * 100;
                                return `
                                    <div class="emotion-bar">
                                        <div class="emotion-bar-label">
                                            <span>${emotion.emotion}</span>
                                            <span>${emotion.count} instances</span>
                                        </div>
                                        <div class="emotion-bar-track">
                                            <div class="emotion-bar-fill" style="width: ${percentage}%"></div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            // Sentiment data
            if (emotionData.sentiment_breakdown && emotionData.sentiment_breakdown.length > 0) {
                html += `
                    <div class="detail-card">
                        <h3>Sentiment Analysis</h3>
                        <div class="sentiment-pills">
                            ${emotionData.sentiment_breakdown.map(sentiment => `
                                <div class="sentiment-pill ${sentiment.sentiment}">
                                    ${sentiment.sentiment}: ${sentiment.count}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // Segments
            if (scene.segments && scene.segments.length > 0) {
                html += `
                    <div class="detail-card">
                        <h3>Audio Segments (${scene.segments.length})</h3>
                        <div class="segment-list">
                            ${scene.segments.map(segment => `
                                <div class="segment-item">
                                    <div class="segment-header">
                                        <span class="segment-speaker">${segment.speaker || 'Unknown Speaker'}</span>
                                        <span class="segment-time">${formatTime(segment.start)} - ${formatTime(segment.end)}</span>
                                    </div>
                                    <div>${formatDuration(segment.duration)}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            document.getElementById('panel-content').innerHTML = html;
        }

        // Clear selection
        function clearSelection() {
            document.querySelectorAll('.scene-item').forEach(item => {
                item.classList.remove('active');
            });
            
            document.getElementById('panel-title').textContent = 'Welcome to Scene Explorer';
            document.getElementById('breadcrumb-current').innerHTML = 'Scenes';
            
            document.getElementById('panel-content').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🎥</div>
                    <h3>Select a scene to view details</h3>
                    <p>Choose a scene from the list on the left to explore its content, emotions, and metadata.</p>
                </div>
            `;
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Scene Explorer initialized');
            loadScenes();
        });
    </script>
</body>
</html>
